name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore updated Android source
        run: unzip -o ptt-android-source-v0.2.1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists and contains updated UI source
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/app.js | grep -q DEFAULT_ENDPOINT
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q 'Servidor WSS'
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q 'Token compartido'
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
