services:
  - type: web
    name: ptt-taxis-signaling
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PTT_SHARED_TOKEN
        generateValue: true
      - key: NODE_VERSION
        value: "22"
